<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Faker冠軍數量圖</title>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>

<body>

<div id="chart_div" style="width: 900px; height: 500px;"></div>

<script>
google.charts.load('current', {'packages':['corechart']});
google.charts.setOnLoadCallback(drawChart);

function drawChart() {

  var data = google.visualization.arrayToDataTable([
    ['Type', 'Year', 'Count', 'fontSize'],

    ['LCK',   2013, 1.15, 0.5],
    ['World', 2013, 0.95, 0.5],

    ['LCK',   2014, 1.15, 0.5],
    ['Other', 2014, 0.95, 0.5],

    ['LCK',   2015, 2.10, 0.5],
    ['World', 2015, 1.10, 0.5],

    ['LCK',   2016, 1.25, 0.5],
    ['World', 2016, 1.10, 0.5],
    ['MSI',   2016, 0.95, 0.5],
    ['Other', 2016, 0.80, 0.5],

    ['LCK',   2017, 1.10, 0.5],
    ['MSI',   2017, 0.90, 0.5],

    ['LCK',   2019, 2.10, 0.5],
    ['Other', 2019, 1.00, 0.5],

    ['LCK',   2020, 1.00, 0.5],

    ['LCK',   2022, 1.00, 0.5],


    ['World', 2023, 1.00, 0.5],

    ['World', 2024, 1.10, 0.5],
    ['Other', 2024, 0.90, 0.5],

    ['World', 2025, 1.00, 0.5]
  ]);

 var options = {
  title: '2013-2025 年各賽事類型冠軍數量泡泡圖',
  hAxis: {
    title: 'Year',
    minValue: 2012,
    maxValue: 2026,
    ticks: [
      2012, 2013, 2014, 2015, 2016, 2017, 2018,
      2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026
    ]
  },
  vAxis: {
    title: '數量',
    minValue: 0,
    maxValue: 2
  },
  bubble: {
    textStyle: {
      fontSize: 10
    }
  }

};


  var chart = new google.visualization.BubbleChart(
    document.getElementById('chart_div')
  );
  chart.draw(data, options);
}
</script>

</body>
</html>
